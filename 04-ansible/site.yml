- name: Baseline web servers
  hosts: web
  serial: 1
  max_fail_percentage: 0
  vars:
    tz: Asia/Jakarta
    packages: [htop, curl]

  tasks:
    - name: Timezone
      ansible.builtin.file:
        src: "/usr/share/zoneinfo/{{ tz }}"
        dest: /etc/localtime
        state: link
        force: true

    - name: Timezone name
      ansible.builtin.copy:
        content: "{{ tz }}\n"
        dest: /etc/timezone

    - name: Packages
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
        update_cache: true
        cache_valid_time: 86400

    - name: Nginx baseline
      block:
        - name: Copy baseline config
          ansible.builtin.copy:
            src: files/00-baseline.conf
            dest: /etc/nginx/conf.d/00-baseline.conf
            backup: true
          register: baseline
          notify: Reload nginx

        - name: Test nginx config
          ansible.builtin.command: nginx -t
          changed_when: false

      rescue:
        - name: Restore previous config
          ansible.builtin.copy:
            src: "{{ baseline.backup_file }}"
            dest: /etc/nginx/conf.d/00-baseline.conf
            remote_src: true
          when: baseline.backup_file is defined

        - name: Remove new config (there was no previous one)
          ansible.builtin.file:
            path: /etc/nginx/conf.d/00-baseline.conf
            state: absent
          when: baseline.backup_file is not defined

        - name: Stop the rollout
          ansible.builtin.fail:
            msg: "nginx -t failed on {{ inventory_hostname }}, previous config restored"

    - name: Status page
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html

  handlers:
    # Di server sungguhan: ansible.builtin.service name=nginx state=reloaded
    - name: Reload nginx
      ansible.builtin.shell: pgrep -x nginx >/dev/null && nginx -s reload || nginx
