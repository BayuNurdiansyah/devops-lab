services:
  kuma:
    image: louislam/uptime-kuma:2
    container_name: kuma
    ports:
      - "3001:3001"
    volumes:
      - ./data/kuma:/app/data
    restart: unless-stopped

  site-a:
    image: nginx:alpine
    container_name: site-a
    volumes:
      - ./site-a:/usr/share/nginx/html:ro
    restart: unless-stopped

  site-b:
    image: nginx:alpine
    container_name: site-b
    volumes:
      - ./site-b/index.html:/usr/share/nginx/html/index.html
      - ./site-b/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  cron-job:
    image: curlimages/curl:latest
    container_name: cron-job
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if [ -n "$$PUSH_URL" ]; then
            curl -fsS "$$PUSH_URL?status=up&msg=OK" > /dev/null && echo "$$(date) ping sent"
          else
            echo "$$(date) PUSH_URL belum diisi"
          fi
          sleep 30
        done
    environment:
      - PUSH_URL=${PUSH_URL:-}
    restart: unless-stopped
